[project]
name = "anki-normalize"
version = "0.1.0"
description = "Normalize editor-generated HTML in an Anki collection"
requires-python = ">=3.10"
dependencies = ["anki==26.8.1"]

[project.scripts]
anki-normalize = "anki_normalize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_normalize"]

[tool.uv]
package = true
